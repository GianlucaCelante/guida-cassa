<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<meta charset="utf-8">
<title>Guida alla Cassa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap">
<style>
/* Brand cèlan: Anton per i titoli (maiuscolo), Archivo per il testo; grigio caldo, inchiostro, rosso cèlan.
   Layout: home a colonna unica che scorre; voce = schermo intero 100dvh (titolo, testo del passo, schermata che si adatta, pulsanti fissi in basso). */
:root{
  --bg:#E9E9E9; --bg-2:#E2DFDA; --surface:#FCFBFA; --surface-2:#F1EFEC; --ink:#111110; --muted:#5A5853;
  --line:rgba(17,17,16,.14); --line-strong:rgba(17,17,16,.32);
  --accent:#F0563C; --accent-strong:#CC3D20; --on-accent:#FFFFFF; --accent-text:#B03621; --accent-soft:rgba(240,86,60,.12);
  --mark-bg:#F8C800; --mark-ink:#111110; --focus:#111110; --frame:rgba(17,17,16,.18);
  --shadow:0 1px 0 rgba(17,17,16,.04),0 18px 40px -24px rgba(17,17,16,.28);
  --font-ui:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Anton","Archivo",Impact,"Arial Narrow",sans-serif;
  --r-card:22px; --r-pill:999px; --r-ui:10px; --ease:cubic-bezier(.32,.72,0,1); --ease-reveal:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141312; --bg-2:#1B1917; --surface:#1F1D1B; --surface-2:#292624; --ink:#FCFBFA; --muted:#BAB5AD;
  --line:rgba(252,251,250,.16); --line-strong:rgba(252,251,250,.4);
  --accent:#F0563C; --accent-strong:#CC3D20; --on-accent:#FFFFFF; --accent-text:#FF957E; --accent-soft:rgba(240,86,60,.2);
  --mark-bg:#F8C800; --mark-ink:#111110; --focus:#FCFBFA; --frame:rgba(252,251,250,.2);
  --shadow:0 1px 0 rgba(0,0,0,.3),0 18px 40px -24px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141312; --bg-2:#1B1917; --surface:#1F1D1B; --surface-2:#292624; --ink:#FCFBFA; --muted:#BAB5AD;
  --line:rgba(252,251,250,.16); --line-strong:rgba(252,251,250,.4);
  --accent:#F0563C; --accent-strong:#CC3D20; --on-accent:#FFFFFF; --accent-text:#FF957E; --accent-soft:rgba(240,86,60,.2);
  --mark-bg:#F8C800; --mark-ink:#111110; --focus:#FCFBFA; --frame:rgba(252,251,250,.2);
  --shadow:0 1px 0 rgba(0,0,0,.3),0 18px 40px -24px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.wrap{max-width:1100px;margin:0 auto;padding-block:18px 64px}
h1,h2,h3{margin:0;text-wrap:balance}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:8px}
#h:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block}
mark{background:var(--mark-bg);color:var(--mark-ink);border-radius:4px;padding:0 2px}
.display{font-family:var(--font-display);font-weight:400;text-transform:uppercase;letter-spacing:-.01em;line-height:.98}

/* testata */
.top{display:flex;flex-direction:column;gap:18px;padding-block:6px 10px}
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.wordmark{font-family:var(--font-display);font-size:28px;line-height:1;letter-spacing:.01em;color:var(--ink);display:flex;align-items:center;gap:10px}
.wordmark i{display:block;width:12px;height:12px;border-radius:50%;background:var(--accent)}
.tag{font-weight:600;font-size:16px;color:var(--muted)}
.hero-title{font-size:clamp(46px,9vw,96px)}
.hero-title span{color:var(--accent-strong)}
.search{position:relative}
.search input{width:100%;min-height:72px;border-radius:var(--r-pill);border:1.5px solid var(--line-strong);background:var(--surface);
  padding:14px 24px 14px 62px;font-size:21px;font-weight:500;-webkit-appearance:none;appearance:none;transition:border-color .3s var(--ease),box-shadow .3s var(--ease)}
.search input::-webkit-search-cancel-button{display:none}
.search input::placeholder{color:var(--muted);opacity:1}
.search input:focus{outline:none;border-color:var(--accent-strong);box-shadow:0 0 0 4px var(--accent-soft)}
.search .ico{position:absolute;left:22px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search.has-text input{padding-right:150px}
.search .clear[hidden]{display:none}
.search .clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);height:52px;border:1.5px solid var(--line-strong);border-radius:var(--r-pill);background:transparent;cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:6px;padding:0 16px 0 12px;font-size:17px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;padding:8px 18px;border-radius:var(--r-pill);border:1.5px solid var(--line-strong);background:transparent;cursor:pointer;font-weight:600;font-size:17px;transition:background-color .3s var(--ease),color .3s var(--ease)}
.chip:hover{background:var(--ink);color:var(--bg)}

/* sezioni e schede */
.section{margin-block:40px}
.section-head{display:flex;align-items:baseline;gap:14px;margin-bottom:16px;border-top:1px solid var(--line);padding-top:16px}
.section-head h2{font-size:clamp(30px,4.4vw,48px)}
.section-head .count{font-size:16px;color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{display:flex;align-items:center;gap:14px;min-height:88px;padding:14px 16px;border-radius:var(--r-card);border:1px solid var(--line);
  background:var(--surface);text-align:left;cursor:pointer;width:100%;box-shadow:var(--shadow);transition:transform .45s var(--ease),border-color .3s var(--ease)}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.card:active{transform:scale(.985)}
.card .cico{width:48px;height:48px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;flex:none;color:var(--accent-text)}
.card .ct{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.card .q{font-weight:600;font-size:19px;line-height:1.3;overflow-wrap:break-word}
.card .snip{font-size:17px;color:var(--muted);line-height:1.4;overflow-wrap:break-word}
.card .go{flex:none;color:var(--accent-strong)}
.empty{padding:22px;border-radius:var(--r-card);background:var(--surface);border:1.5px dashed var(--line-strong);display:flex;flex-direction:column;gap:14px}
.empty p{margin:0}
.ui{font-weight:700;background:var(--accent-soft);color:var(--accent-text);border-radius:6px;padding:0 5px;-webkit-box-decoration-break:clone;box-decoration-break:clone}

/* vista di una voce: tutto in uno schermo */
body.guide{overflow:hidden}
body.guide .wrap{height:100vh;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding-block:12px calc(var(--navh,76px) + 10px);display:flex;flex-direction:column}
body.guide #app{flex:1;min-height:0;display:flex;flex-direction:column}
.gview{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.ghead{flex:none;display:flex;flex-direction:column;gap:8px}
.ghead h1{font-size:clamp(22px,3.4vw,36px)}
.back{align-self:flex-start;min-height:44px;display:inline-flex;align-items:center;gap:6px;padding:0 16px 0 10px;border-radius:var(--r-pill);border:1.5px solid var(--line-strong);background:transparent;cursor:pointer;font-weight:600;font-size:16px}
.step{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;box-shadow:var(--shadow)}
.step .body{flex:none;max-height:40%;overflow:auto;padding:14px 18px;border-bottom:1px solid var(--line)}
.step.noimg .body{flex:1;max-height:none;border-bottom:0}
.step .txt{font-size:clamp(18px,2.2vw,22px);line-height:1.45;font-weight:600;margin:0;overflow-wrap:break-word}
.step .fig{flex:1;min-height:0;padding:10px;background:var(--surface-2);container-type:size;display:flex;align-items:center;justify-content:center}

/* schermata reale: a tutta larghezza da 560px in su, ritaglio ingrandito sul telefono; si adatta allo spazio (contain) */
.shot{position:relative;width:100%;max-width:100%;flex:none;border-radius:12px;overflow:hidden;border:1px solid var(--frame);background:#fff;container-type:inline-size;--zz:1}
.shot .stage{position:absolute;inset:0}
.shot .stage>img{display:block;width:100%;height:100%;object-fit:cover;max-width:none}
.shot .veil{position:absolute;inset:0;background:rgba(20,19,18,.32);-webkit-backdrop-filter:blur(1.2px);backdrop-filter:blur(1.2px)}
@supports (width:1cqw){.shot .veil{-webkit-backdrop-filter:blur(calc(.2cqw * var(--zz)));backdrop-filter:blur(calc(.2cqw * var(--zz)))}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.shot .veil{background:rgba(20,19,18,.5)}}
.shot .marks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.shot .lens{position:absolute;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.6)}
.shot .lens img{position:absolute;max-width:none;display:block}

/* pulsanti in basso */
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.navbar .in{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.navbar .grp{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.nbtn{min-height:46px;border-radius:var(--r-pill);font-weight:600;font-size:17px;line-height:1.2;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:6px 18px;
  transition:transform .4s var(--ease),opacity .3s var(--ease);text-align:left}
.nbtn:active{transform:scale(.98)}
.nbtn.out{background:transparent;border:1.5px solid var(--line-strong)}
.nbtn.main{background:var(--accent-strong);color:var(--on-accent);border:1.5px solid var(--accent-strong);padding-right:8px}
.nbtn.main .ic{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none;transition:transform .4s var(--ease)}
.nbtn.main:hover .ic{transform:translateX(2px)}
.nbtn .t1{display:block}
.nbtn .t2{display:block;font-size:16px;font-weight:500;opacity:.9;max-width:40ch;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.nbtn:disabled{opacity:.4;cursor:default}

/* animazioni */
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s var(--ease-reveal) infinite}
@keyframes pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.4)}}
.fade{animation:fade .4s var(--ease-reveal)}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.pulse{animation:none;opacity:0}.fade{animation:none}.card,.nbtn,.chip{transition:none}}

@media (max-width:560px){
  .grid{grid-template-columns:1fr}
  .step .fig{padding:6px}
  .step .body{padding:12px 14px}
  .search input{font-size:19px;padding-left:54px;padding-right:18px}
  .search.has-text input{padding-right:136px}
  .search .ico{left:18px}
  .navbar .in{gap:8px}
  .navbar .grp{gap:8px}
  .navbar .in.last .main{flex:1 1 100%;justify-content:space-between}
}
</style>

const STEPMAP={
  'prendere-ordine':[1,2,3,6,4,5],
  'chiusura-giornata':[1,{n:2,b:[0]},{n:2,b:[1]},3,4,5],

  'piatto-altra-categoria':[1,{n:2,b:[0]},{n:2,b:[1]},3],
  'correggere-pagamento':[{g:'annullare-ordine',n:1},1,2,{n:3,b:[0]},{n:3,b:[1]}],
  'eliminare-piatto':[2,3,4],
  'fattura':[1,0,0,0,0],
  'piatto-non-si-aggiunge':[1,2],
  'ristampare':[1,2,{n:3,b:[0,1]},4]
};
function shotFor(g,i){
  const m=STEPMAP[g.id]; let ref=m?m[i]:i+1;
  if(!ref) return null;
  if(typeof ref==='number') ref={n:ref};
  const set=SHOTS[ref.g||g.id]; if(!set) return null;
  const sh=set[ref.n]; if(!sh) return null;
  return ref.b ? Object.assign({},sh,{b:ref.b.map(k=>sh.b[k]).filter(Boolean)}) : sh;
}
function shotHtml(sh,label){
  const W=sh.w,H=sh.h,PAD=8,R=12;
  const pc=v=>(v*100).toFixed(3)+'%';
  const rings=sh.b.map(function(b){
    const x=Math.max(0,b[0]-PAD), y=Math.max(0,b[1]-PAD);
    const w=Math.min(W,b[0]+b[2]+PAD)-x, h=Math.min(H,b[1]+b[3]+PAD)-y;
    return [x,y,w,h,Math.min(R,w/2,h/2)];
  });
  // Unione dei riquadri: serve per scegliere il ritaglio in base allo spazio disponibile (vedi layoutShots).
  let U='';
  if(rings.length){
    let ux=Infinity,uy=Infinity,ux2=0,uy2=0;
    rings.forEach(function(q){ux=Math.min(ux,q[0]);uy=Math.min(uy,q[1]);ux2=Math.max(ux2,q[0]+q[2]);uy2=Math.max(uy2,q[1]+q[3]);});
    U=[ux,uy,ux2,uy2].map(function(v){return Math.round(v);}).join(',');
  }
  const st='aspect-ratio:'+W+'/'+H;
  let h='<figure class="shot" style="'+st+'" data-w="'+W+'" data-h="'+H+'" data-u="'+U+'" data-a="'+(rings[0]&&rings[0][2]*rings[0][3]<W*H*0.2?rings[0].slice(0,4).map(Math.round).join(','):'')+'"><div class="stage">';
  h+='<img src="'+sh.f+'" width="1000" height="'+Math.round(H*1000/W)+'" loading="lazy" decoding="async" alt="'+esc(label)+'">';
  if(rings.length){
    // Velo sfocato e scurito su tutta la schermata; sopra, una "lente" nitida per ogni elemento da toccare.
    h+='<div class="veil" aria-hidden="true"></div>';
    rings.forEach(function(q){
      const [x,y,w,hh,r]=q;
      h+='<div class="lens" aria-hidden="true" style="left:'+pc(x/W)+';top:'+pc(y/H)+';width:'+pc(w/W)+';height:'+pc(hh/H)+';border-radius:'+(r/w*100).toFixed(2)+'%/'+(r/hh*100).toFixed(2)+'%">'
        +'<img src="'+sh.f+'" alt="" style="width:'+pc(W/w)+';height:'+pc(H/hh)+';left:'+pc(-x/w)+';top:'+pc(-y/hh)+'"></div>';
    });
    let s='<svg class="marks" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true" focusable="false">';
    rings.forEach(function(q){
      const [x,y,w,hh,r]=q;
      s+='<rect class="pulse" x="'+x+'" y="'+y+'" width="'+w+'" height="'+hh+'" rx="'+r+'" fill="none" stroke="#F0563C" stroke-width="3" vector-effect="non-scaling-stroke"/>';
      s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+hh+'" rx="'+r+'" fill="none" stroke="#fff" stroke-width="6" vector-effect="non-scaling-stroke"/>';
      s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+hh+'" rx="'+r+'" fill="none" stroke="#CC3D20" stroke-width="3" vector-effect="non-scaling-stroke"/>';
    });
    // Una sola freccia, sul primo elemento da toccare: disegnata da layoutShots dentro la zona visibile.
    s+='<path class="arw arw-b" d="" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round" vector-effect="non-scaling-stroke"/>';
    s+='<path class="arw arw-f" d="" stroke="#CC3D20" stroke-width="4" fill="none" stroke-linecap="round" vector-effect="non-scaling-stroke"/>';
    s+='</svg>';
    h+=s;
  }
  h+='</div></figure>';
  return h;
}

/* Adatta ogni schermata allo spazio libero: il ritaglio prende la forma del riquadro disponibile
   (niente vuoti sopra e sotto, niente tagli dell'elemento), con più ingrandimento sul telefono. */
function layoutShots(){
  document.querySelectorAll('.step .fig .shot').forEach(function(sh){
    const fig=sh.parentElement, cs=getComputedStyle(fig);
    const fw=fig.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
    const fh=fig.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
    if(fw<20||fh<20) return;
    const W=+sh.dataset.w, H=+sh.dataset.h, ra=fw/fh;
    let cx=0,cy=0,cw=W,ch=H;
    if(sh.dataset.u){
      const u=sh.dataset.u.split(',').map(Number), bw=u[2]-u[0], bh=u[3]-u[1], mx=(u[0]+u[2])/2, my=(u[1]+u[3])/2;
      if(innerWidth<560){ cw=Math.min(W,Math.max(320,bw+(bw>460?40:150))); ch=cw/ra; }
      else if(ra<W/H){ ch=H; cw=H*ra; }          // spazio più alto che largo: ritaglio a tutta altezza
      else { cw=W; ch=H; }                        // spazio largo: schermata intera
      if(ch>H){ ch=H; cw=Math.min(W,H*ra); }
      if(cw>W){ cw=W; ch=Math.min(H,W/ra); }
      if(cw<bw+24){ cw=Math.min(W,bw+24); ch=Math.min(H,cw/ra); }
      if(ch<bh+24){ ch=Math.min(H,bh+24); cw=Math.min(W,ch*ra); }
      if(cw<bw+16||ch<bh+16){ cw=W; ch=H; }      // zona troppo grande per un ritaglio: schermata intera
      cx=Math.max(0,Math.min(W-cw,mx-cw/2)); cy=Math.max(0,Math.min(H-ch,my-ch/2));
    }
    const ar=cw/ch, dw=Math.min(fw,fh*ar);
    sh.style.aspectRatio=cw.toFixed(1)+'/'+ch.toFixed(1);
    sh.style.width=dw+'px';
    sh.style.setProperty('--zz',(W/cw).toFixed(3));
    const st=sh.querySelector('.stage'); const pc=v=>(v*100).toFixed(3)+'%';
    st.style.left=pc(-cx/cw); st.style.top=pc(-cy/ch); st.style.width=pc(W/cw); st.style.height=pc(H/ch);
    const a=sh.dataset.a, b=sh.querySelector('.arw-b'), f=sh.querySelector('.arw-f');
    if(a&&b&&f){
      const q=a.split(',').map(Number), x=q[0], y=q[1], w=q[2], hh=q[3];
      const ccx=cx+cw/2, ccy=cy+ch/2, tcx=x+w/2, tcy=y+hh/2;
      const dx=tcx>ccx?-1:1, dy=tcy>ccy?-1:1, hx=dx>0?x+w:x, hy=dy>0?y+hh:y;
      const k=cw/7; let tx=hx+dx*k, ty=hy+dy*k*.85;
      tx=Math.max(cx+12,Math.min(cx+cw-12,tx)); ty=Math.max(cy+12,Math.min(cy+ch-12,ty));
      let d='';
      if(Math.hypot(tx-hx,ty-hy)>cw/40){
        const ang=Math.atan2(hy-ty,hx-tx), L=cw/26, a1=ang+2.55, a2=ang-2.55, r=v=>v.toFixed(0);
        d='M'+r(tx)+' '+r(ty)+'L'+r(hx)+' '+r(hy)+'M'+r(hx)+' '+r(hy)+'L'+r(hx+L*Math.cos(a1))+' '+r(hy+L*Math.sin(a1))+'M'+r(hx)+' '+r(hy)+'L'+r(hx+L*Math.cos(a2))+' '+r(hy+L*Math.sin(a2));
      }
      b.setAttribute('d',d); f.setAttribute('d',d);
    }
  });
}
window.addEventListener('resize',function(){ layoutShots(); });

/* distanza di modifica con scambio di lettere vicine (Damerau, versione OSA), con uscita anticipata */
function dist(a,b,max){
  if(Math.abs(a.length-b.length)>max) return max+1;
  const d=[]; for(let i=0;i<=a.length;i++){ d[i]=[i]; } for(let j=1;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++){ let best=99;
    for(let j=1;j<=b.length;j++){ const c=a[i-1]===b[j-1]?0:1;
      d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);
      if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);

    if(best>max) return max+1; }
  return d[a.length][b.length];

    qs.forEach(function(q){
      const best={t:0,k:0,b:0};
      Object.keys(FIELD).forEach(function(f){ g._f[f].forEach(function(t){ const m=wordScore(q,t,f)*FIELD[f]; if(m>best[f]) best[f]=m; }); });
      const mx=Math.max(best.t,best.k,best.b);
      if(!mx) all=false;
      total+=mx+.2*(best.t+best.k+best.b-mx);
    });
    if(total>0) res.push({g:g,score:total,all:all,idx:idx});
  });
  let list=res.filter(function(r){ return r.all; }); if(!list.length) list=res;
  list.sort(function(a,b){ return (b.score-a.score)||(a.idx-b.idx); });
  if(list.length){ const top=list[0].score; list=list.filter(function(r){ return r.score>=top*.45; }); }
  return {list:list.map(function(r){ return r.g; }), q:qs};
}
function highlight(text,qs){
  return esc(text).replace(/[A-Za-zÀ-ÿ0-9]+/g,function(tok){
    const r=norm(tok); if(!r||r.length<2||STOP.has(r)) return tok;
    const t={r:r,s:stem(r)};
    return qs.some(function(q){ return wordScore(q,t)>0; }) ? '<mark>'+tok+'</mark>' : tok;
  });
}
function snippet(g,qs){
  for (const st of g.steps){ const ts=tokens(st.t); if(ts.some(function(t){ return qs.some(function(q){ return wordScore(q,t)>=.6; }); })) return st.t; }
  return '';
}


/* ---------------- interfaccia ---------------- */
const app=document.getElementById('app'), navbar=document.getElementById('navbar');
const fmt=s=>esc(s).replace(/«([^»]+)»/g,'<span class="ui">«$1»</span>');
const fmtMarked=(html)=>html.replace(/«([^»]+)»/g,'<span class="ui">«$1»</span>');
const icon=(n,sz)=>'<svg width="'+(sz||24)+'" height="'+(sz||24)+'" aria-hidden="true"><use href="#i-'+n+'"/></svg>';
const SUGGEST=['statistiche','export','tavolo','conto','preconto','piatto','menu','cliente','soldi','pagare'];
function cardHtml(g,qs){
  const title = qs ? fmtMarked(highlight(g.q,qs)) : fmt(g.q);
  let sn=''; if(qs){ const t=snippet(g,qs); if(t) sn='<span class="snip">'+fmtMarked(highlight(t,qs))+'</span>'; }
  return '<button class="card" type="button" data-go="'+g.id+'"><span class="cico">'+icon(g.icon,26)+'</span><span class="ct"><span class="q">'+title+'</span>'+sn+'</span><span class="go">'+icon('right',22)+'</span></button>';
}
let query='';
let homeScroll=0; /* posizione della lista quando si apre una voce: al ritorno si riparte da lì */
if('scrollRestoration' in history) history.scrollRestoration='manual';
function renderHome(){
  navbar.hidden=true; current=null; document.body.classList.remove('guide'); setNavH();
  app.innerHTML='<header class="top"><div class="brandbar"><span class="wordmark" aria-label="cèlan">CÈLAN<i aria-hidden="true"></i></span><span class="tag">Guida alla cassa</span></div>'+
    '<h1 id="h" tabindex="-1" class="display hero-title">Guida alla <span>cassa</span></h1>'+
    '<div class="search" role="search"><span class="ico">'+icon('search',28)+'</span><label class="sr" for="q">Cerca nella guida</label>'+
    '<input id="q" type="search" inputmode="search" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Cosa vuoi fare?">'+
    '<button class="clear" type="button" id="clearq" aria-label="Cancella il testo della ricerca" hidden>'+icon('x',22)+'<span class="lbl" aria-hidden="true">Cancella</span></button></div>'+
    '<div class="chips" aria-label="Ricerche veloci">'+SUGGEST.slice(0,6).map(function(w){return '<button class="chip" type="button" data-q="'+w+'">'+w+'</button>';}).join('')+'</div></header>'+
    '<div id="results" aria-live="polite"></div>';
  const qi=document.getElementById('q'), cl=document.getElementById('clearq');
  qi.value=query;
  const sbox=qi.parentElement; const sync=function(){ cl.hidden=!query; sbox.classList.toggle('has-text',!!query); };
  qi.addEventListener('input',function(){ query=qi.value; sync(); renderResults(); });
  cl.addEventListener('click',function(){ query=''; qi.value=''; sync(); renderResults(); qi.focus(); });
  sync();
  app.querySelectorAll('[data-q]').forEach(function(b){ b.addEventListener('click',function(){ query=b.getAttribute('data-q'); qi.value=query; sync(); renderResults(); qi.focus(); }); });
  renderResults();
}
function renderResults(){
  const box=document.getElementById('results'); let h='';
  if(query.trim()){
    const r=search(query);
    if(r.list.length){
      h+='<section class="section"><div class="section-head"><h2 class="display">'+(r.list.length===1?'1 risposta':r.list.length+' risposte')+'</h2></div><div class="grid">'+r.list.map(function(g){return cardHtml(g,r.q);}).join('')+'</div></section>';
    } else {
      h+='<section class="section"><div class="empty"><p><b>Nessun risultato per «'+esc(query)+'».</b></p><p>Prova con una parola più semplice:</p><div class="chips">'+SUGGEST.map(function(w){return '<button class="chip" type="button" data-s="'+w+'">'+w+'</button>';}).join('')+'</div></div></section>';
    }
  } else {
    SECTIONS.forEach(function(sec){
      const list=G.filter(function(g){return g.sec===sec.id;});
      h+='<section class="section" aria-labelledby="t-'+sec.id+'"><div class="section-head"><h2 class="display" id="t-'+sec.id+'">'+sec.title+'</h2></div><div class="grid">'+list.map(function(g){return cardHtml(g,null);}).join('')+'</div></section>';
    });
  }
  box.innerHTML=h;
  box.querySelectorAll('[data-go]').forEach(function(b){ b.addEventListener('click',function(){ homeScroll=window.scrollY; location.hash=b.getAttribute('data-go'); }); });
  box.querySelectorAll('[data-s]').forEach(function(b){ b.addEventListener('click',function(){ query=b.getAttribute('data-s'); const qi=document.getElementById('q'); qi.value=query; document.getElementById('clearq').hidden=false; qi.parentElement.classList.add('has-text'); renderResults(); qi.focus(); }); });
}

let current=null, pos=0;
function stepHtml(g,i){
  const st=g.steps[i], sh=shotFor(g,i);
  let h='<article class="step fade'+(sh?'':' noimg')+'">';
  h+='<div class="body"><p class="txt">'+fmt(st.t)+'</p></div>';
  if(sh) h+='<div class="fig">'+shotHtml(sh,'Schermata della cassa: '+st.t.replace(/[«»]/g,''))+'</div>';
  h+='</article>';
  return h;
}
function nextGuide(g){ const i=ORDER.indexOf(g); return i>=0 && i<ORDER.length-1 ? ORDER[i+1] : null; }
const navin=document.getElementById('navin');
function setNavH(){ document.documentElement.style.setProperty('--navh',navbar.hidden?'0px':navbar.offsetHeight+'px'); }
window.addEventListener('resize',setNavH);
if(window.ResizeObserver) new ResizeObserver(setNavH).observe(navbar);
function renderGuide(){
  const g=current, tot=g.steps.length, last=(pos===tot-1);
  document.body.classList.add('guide');
  app.innerHTML='<div class="gview"><div class="ghead"><button class="back" type="button" id="home">'+icon('left',22)+'Tutte le domande</button>'+
    '<h1 id="h" tabindex="-1" class="display">'+fmt(g.q)+'</h1></div>'+stepHtml(g,pos)+'</div>';
  const prev='<button class="nbtn out" type="button" id="prev"'+(pos===0?' disabled':'')+'>'+icon('left',22)+'Indietro</button>';
  if(!last){
    navin.className='in';
    navin.innerHTML=prev+'<button class="nbtn main" type="button" id="next">Avanti<span class="ic">'+icon('right',20)+'</span></button>';
  } else {
    const nx=nextGuide(g);
    navin.className='in last';
    navin.innerHTML='<div class="grp">'+prev+'<button class="nbtn out" type="button" id="gohome">Torna alla home</button></div>'+
      (nx?'<button class="nbtn main" type="button" id="gonext"><span><span class="t1">Vai alla prossima voce</span><span class="t2">'+esc(nx.q)+'</span></span><span class="ic">'+icon('right',20)+'</span></button>':'');
    document.getElementById('gohome').addEventListener('click',goHome);
    const gn=document.getElementById('gonext'); if(gn) gn.addEventListener('click',function(){ location.hash=nx.id; });
  }
  navbar.hidden=false;
  const p=document.getElementById('prev'); if(p) p.addEventListener('click',function(){move(-1);});
  const n=document.getElementById('next'); if(n) n.addEventListener('click',function(){move(1);});
  document.getElementById('home').addEventListener('click',goHome);
  setNavH();
  layoutShots();
  const fg=app.querySelector('.fig'); if(fg&&window.ResizeObserver) new ResizeObserver(function(){ layoutShots(); }).observe(fg);
}
function move(delta){
  if(!current) return;
  const tot=current.steps.length, np=Math.max(0,Math.min(tot-1,pos+delta));
  if(np===pos) return;
  pos=np; renderGuide();
}
document.addEventListener('keydown',function(e){
  if(!current) return;
  const tag=(e.target&&e.target.tagName)||''; if(tag==='INPUT') return;
  if(e.key==='ArrowRight'){e.preventDefault();move(1);} else if(e.key==='ArrowLeft'){e.preventDefault();move(-1);}
});
function goHome(){ if(location.hash){ history.pushState('',document.title,location.pathname+location.search); } route(); }
function route(){
  const id=(location.hash||'').replace('#','');
  const g=G.find(function(x){return x.id===id;});
  if(g){ current=g; pos=0; renderGuide(); window.scrollTo(0,0); const h=document.getElementById('h'); if(h) h.focus({preventScroll:true}); }
  else { renderHome(); window.scrollTo(0,homeScroll); }
}
window.addEventListener('hashchange',route);
window.addEventListener('popstate',route);
route();
})();
</script>
